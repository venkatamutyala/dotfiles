name: CI

# Run the installer integration test on every commit and PR.
on:
  push:
  pull_request:

# Least-privilege token: the job only reads the repo.
permissions:
  contents: read

# Cancel superseded runs on the same ref instead of piling up duplicates.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration-test:
    name: install + verify (debian ${{ matrix.debian }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        debian: [bookworm, trixie]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run installer integration test in Debian ${{ matrix.debian }}
        run: |
          docker run --rm -v "$PWD":/repo:ro "debian:${{ matrix.debian }}" \
            bash /repo/tests/integration-test.sh

  lint-and-hooks:
    name: shellcheck + guardrail hooks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: shellcheck (warnings and errors)
        run: |
          git ls-files -z '*.sh' | xargs -0 docker run --rm -v "$PWD":/mnt -w /mnt \
            koalaman/shellcheck:v0.11.0@sha256:61862eba1fcf09a484ebcc6feea46f1782532571a34ed51fedf90dd25f925a8d \
            --severity=warning

      - name: Guardrail hooks (gitleaks runs in Docker)
        run: tests/hooks-test.sh

      - name: remote-session.sh logic (stubbed tailcat, no real network)
        run: tests/remote-session-test.sh
